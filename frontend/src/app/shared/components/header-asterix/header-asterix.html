<header class="header">
  <a class="header__brand" routerLink="/" aria-label="Página inicial da Asterix">
    <img src="/asterix-logo.svg" alt="Asterix Busca Imobiliária">
  </a>

  <nav class="header__nav" aria-label="Menu principal">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Início</a>
    <a routerLink="/imoveis" routerLinkActive="is-active">Buscar imóveis</a>
    <a routerLink="/parceiros" routerLinkActive="is-active">Parceiros</a>
    <a routerLink="/sobre" routerLinkActive="is-active">Sobre</a>
    <a routerLink="/contato" routerLinkActive="is-active">Contato</a>
  </nav>

  <a class="header__cta" routerLink="/contato">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7 4h3l2 5-2 2c1.5 3 3 4.5 6 6l2-2 4 2v3c0 1.1-.9 2-2 2C10.6 21.5 3.5 14.4 3 5c0-.6.4-1 1-1h3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
    Fale conosco
  </a>

  <button type="button" class="header__menu-button" (click)="toggleMenu()" aria-label="Abrir menu" aria-expanded="{{ menuOpen() }}">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 7H20M4 12H20M4 17H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
</header>

@if(menuOpen()){
<div class="header-overlay" (click)="closeMenu()">
  <aside #menuDrawer class="header-sidebar" role="dialog" aria-modal="true" aria-labelledby="menu-title" (click)="$event.stopPropagation()">
    <header class="header-sidebar__top">
      <img src="/asterix-logo.svg" alt="Asterix Busca Imobiliária">
      <button type="button" class="header-sidebar__close" (click)="closeMenu()" aria-label="Fechar menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <nav class="header-sidebar__nav" id="menu-title" aria-label="Menu mobile">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Início</a>
      <a routerLink="/imoveis" routerLinkActive="is-active" (click)="closeMenu()">Buscar imóveis</a>
      <a routerLink="/parceiros" routerLinkActive="is-active" (click)="closeMenu()">Parceiros</a>
      <a routerLink="/sobre" routerLinkActive="is-active" (click)="closeMenu()">Sobre</a>
      <a routerLink="/contato" routerLinkActive="is-active" (click)="closeMenu()">Contato</a>
    </nav>

    <a class="header-sidebar__cta" routerLink="/contato" (click)="closeMenu()">Fale conosco</a>

    <footer class="header-sidebar__footer">
      <span>Asterix Busca Imobiliária</span>
      <small>Conectando pessoas às melhores oportunidades.</small>
    </footer>
  </aside>
</div>
}
